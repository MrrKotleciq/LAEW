name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest -v
      - name: Security scan (bandit)
        run: |
          python -m pip install --quiet bandit
          bandit -r laew -lll --configfile pyproject.toml
      - name: Build package (sdist + wheel)
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel install in a fresh venv
        run: |
          python -m venv /tmp/laew-venv
          /tmp/laew-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/laew-venv/bin/laew --version
          /tmp/laew-venv/bin/laew check --manifest manifests/SYSTEM_MANIFEST.yaml