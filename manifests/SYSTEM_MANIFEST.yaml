# ==============================================================================       
    # LAEW — Local AI Engineering Workspace System Manifest                                
    # Specification: LAEW v1.0                                                             
    # ==============================================================================       
                                                                                           
    version: "1.0"                                                                         
    system_name: "LAEW"                                                                    
    stage: "foundation"                                                                    
                                                                                           
    # ------------------------------------------------------------------------------       
    # 1. Granice i Konfiguracja Obszaru Roboczego (Workspace)                              
    # ------------------------------------------------------------------------------       
    workspace:                                                                             
      root: "."                                                                            
      allowed_paths:                                                                       
        - "configs"                                                                        
        - "docs"                                                                           
        - "manifests"                                                                      
        - "prompts"                                                                        
        - "scripts"                                                                        
        - "tests"                                                                          
        - "tools"                                                                          
      restricted_paths:                                                                    
        - ".git"                                                                           
        - "secrets"                                                                        
      ignored_patterns:                                                                    
        - "**/.env*"                                                                       
        - "**/node_modules/**"                                                             
        - "**/__pycache__/**"                                                              
        - "**/*.gguf"                                                                      
        - "**/*.safetensors"                                                               
                                                                                           
    # ------------------------------------------------------------------------------       
    # 2. Abstrakcyjne Role Modeli (Model Roles - P1)                                       
    # Modele są komponentami wymiennymi; przypisujemy role, nie sztywne nazwy LLM.         
    # ------------------------------------------------------------------------------       
    models:                                                                                
      roles:                                                                               
        primary:                                                                           
          description: "Główny model do rozumowania, planowania i orkiestracji (Chief Agent)"                                                                                  
          context_budget:                                                                  
            system: 2000                                                                   
            conversation: 4000                                                             
            rag: 8000                                                                      
            tools: 4000                                                                    
            total: 18000                                                                   
        embedding:                                                                         
          description: "Model do generowania wektorów na potrzeby bazy wiedzy i RAG"
          model_name: "nomic-embed-text:latest"       
          target_dimensions: 768                                                           
        reviewer:                                                                          
          description: "Model specjalistyczny do audytu architektury i przeglądu kodu"     
                                                                                           
    # ------------------------------------------------------------------------------       
    # 3. Rejestr Narzędzi i Polityki Uprawnień (Tool Registry & Security - P8)             
    # Ograniczenia bezpieczeństwa wymuszane poniżej warstwy modelu.                        
    # ------------------------------------------------------------------------------       
    tools:                                                                                 
      categories:                                                                          
        filesystem:                                                                        
          policy: "read_only_by_default"                                                   
          allowed_operations:                                                              
            - "view_file"                                                                  
            - "list_dir"                                                                   
            - "find_by_name"                                                               
            - "grep_search"                                                                
          require_user_approval:                                                           
            - "write_file"                                                                 
            - "replace_file_content"                                                       
            - "delete_file"                                                                
        git:                                                                               
          policy: "inspection_first"                                                       
          allowed_operations:                                                              
            - "status"                                                                     
            - "diff"                                                                       
            - "log"                                                                        
          require_user_approval:                                                           
            - "commit"                                                                     
            - "checkout"                                                                   
            - "branch"                                                                     
          forbidden_operations:                                                            
            - "reset_hard"                                                                 
            - "push_force"                                                                 
            - "clean_f"                                                                    
        terminal:                                                                          
          policy: "safe_command_allowlist"                                                 
          allowlist:                                                                       
            - "ls"                                                                         
            - "git status"                                                                 
            - "git diff"                                                                   
            - "git log"                                                                    
            - "find"                                                                       
            - "cat"                                                                        
          require_user_approval:                                                           
            - "run_tests"                                                                  
            - "build"                                                                      
          forbidden_patterns:                                                              
            - "rm -rf"                                                                     
            - "sudo"                                                                       
            - "chmod"                                                                      
            - "> /dev/*"                                                                   
        web:                                                                               
          policy: "read_only"
          allowed_operations:
            - "search_web"
            - "read_url_content"
  
    # ------------------------------------------------------------------------------       
    # 4. Warstwy Pamięci i Baza Wiedzy (Memory & Second Brain - P2)
    # ------------------------------------------------------------------------------       
    memory:
      session:
        type: "ephemeral"
        storage: "runtime/sessions"
      second_brain:
        type: "obsidian_vault"
        path: "knowledge"
        structure:
          - "Knowledge"
          - "Decisions"
          - "Research"
          - "Templates"
  
    # ------------------------------------------------------------------------------       
    # 5. Podsystem RAG (Retrieval-Augmented Generation)
    # ------------------------------------------------------------------------------       
    rag:
      pipeline:
        retrieval: "vector_search"
        reranking: true
        top_k: 5
        max_context_tokens: 8000
      vector_store:
        enabled: false
        host: "localhost"
        port: 8000
        timeout: 30
        project_collection: "laew_project"
        global_collection: "laew_global"

    # ------------------------------------------------------------------------------
    # 6. Agent Robustness (LLM Providers & Retry)
    # ------------------------------------------------------------------------------
    agent:
      llm:
        providers:
          - name: "ollama_primary"
            type: "ollama"
            model: "llama3.1"
            host: "localhost"
            port: 11434
          - name: "ollama_fallback"
            type: "ollama"
            model: "mistral:latest"
            host: "localhost"
            port: 11434
        retry:
          max_attempts: 3
          backoff_base_ms: 1000
          max_backoff_ms: 5000
