# ==============================================================================       
    # LAEW — Local AI Engineering Workspace System Manifest                                
    # Specification: LAEW v1.0                                                             
    # ==============================================================================       
                                                                                           
    version: "1.0"                                                                         
    system_name: "LAEW"                                                                    
    stage: "foundation"                                                                    
                                                                                           
    # ------------------------------------------------------------------------------       
    # 1. Granice i Konfiguracja Obszaru Roboczego (Workspace)                              
    # ------------------------------------------------------------------------------       
    workspace:                                                                             
      root: "."                                                                            
      allowed_paths:                                                                       
        - "configs"                                                                        
        - "docs"                                                                           
        - "manifests"                                                                      
        - "prompts"                                                                        
        - "scripts"                                                                        
        - "tests"                                                                          
        - "tools"                                                                          
      restricted_paths:                                                                    
        - ".git"                                                                           
        - "secrets"                                                                        
      ignored_patterns:                                                                    
        - "**/.env*"                                                                       
        - "**/node_modules/**"                                                             
        - "**/__pycache__/**"                                                              
        - "**/*.gguf"                                                                      
        - "**/*.safetensors"                                                               
                                                                                           
    # ------------------------------------------------------------------------------       
    # 2. Abstrakcyjne Role Modeli (Model Roles - P1)                                       
    # Modele są komponentami wymiennymi; przypisujemy role, nie sztywne nazwy LLM.         
    # ------------------------------------------------------------------------------       
    models:                                                                                
      roles:                                                                               
        primary:                                                                           
          description: "Główny model do rozumowania, planowania i orkiestracji (Chief Agent)"                                                                                  
          context_budget:                                                                  
            system: 2000                                                                   
            conversation: 4000                                                             
            rag: 8000                                                                      
            tools: 4000                                                                    
            total: 18000                                                                   
        embedding:
          description: "Model do generowania wektorów na potrzeby bazy wiedzy i RAG"
          type: "llamacpp"
          base_url: "http://127.0.0.1:8081"
          model_name: "laew-qwen3-embedding"
          target_dimensions: 1024
          timeout: 30
        reviewer:                                                                          
          description: "Model specjalistyczny do audytu architektury i przeglądu kodu"     
                                                                                           
    # ------------------------------------------------------------------------------       
    # 3. Rejestr Narzędzi i Polityki Uprawnień (Tool Registry & Security - P8)             
    # Ograniczenia bezpieczeństwa wymuszane poniżej warstwy modelu.                        
    # ------------------------------------------------------------------------------       
    tools:                                                                                 
      categories:                                                                          
        filesystem:                                                                        
          policy: "read_only_by_default"                                                   
          allowed_operations:                                                              
            - "view_file"                                                                  
            - "list_dir"                                                                   
            - "find_by_name"                                                               
            - "grep_search"                                                                
          require_user_approval:                                                           
            - "write_file"                                                                 
            - "replace_file_content"                                                       
            - "delete_file"                                                                
        git:                                                                               
          policy: "inspection_first"                                                       
          allowed_operations:                                                              
            - "status"                                                                     
            - "diff"                                                                       
            - "log"                                                                        
          require_user_approval:                                                           
            - "commit"                                                                     
            - "checkout"                                                                   
            - "branch"                                                                     
          forbidden_operations:                                                            
            - "reset_hard"                                                                 
            - "push_force"                                                                 
            - "clean_f"                                                                    
        terminal:                                                                          
          policy: "safe_command_allowlist"                                                 
          allowlist:                                                                       
            - "ls"                                                                         
            - "git status"                                                                 
            - "git diff"                                                                   
            - "git log"                                                                    
            - "find"                                                                       
            - "cat"                                                                        
          require_user_approval:                                                           
            - "run_tests"                                                                  
            - "build"                                                                      
          forbidden_patterns:                                                              
            - "rm -rf"                                                                     
            - "sudo"                                                                       
            - "chmod"                                                                      
            - "> /dev/*"                                                                   
        web:                                                                               
          policy: "read_only"
          allowed_operations:
            - "search_web"
            - "read_url_content"
  
    # ------------------------------------------------------------------------------       
    # 4. Warstwy Pamięci i Baza Wiedzy (Memory & Second Brain - P2)
    # ------------------------------------------------------------------------------       
    memory:
      session:
        type: "ephemeral"
        storage: "runtime/sessions"
      second_brain:
        type: "obsidian_vault"
        path: "@knowledge"
        structure:
          - "Knowledge"
          - "Decisions"
          - "Research"
          - "Templates"
  
    # ------------------------------------------------------------------------------       
    # 5. Podsystem RAG (Retrieval-Augmented Generation)
    # ------------------------------------------------------------------------------       
    rag:
      pipeline:
        retrieval: "vector_search"
        reranking: true
        top_k: 5
        max_context_tokens: 8000
      project_sources:
        # Project RAG is an allowlist, not a repository-wide Markdown crawl.
        # @knowledge remains a separate global vault scope.
        allowlist:
          - "README.md"
          - "docs/README.md"
          - "docs/INSTALL.md"
          - "docs/LAEW_CONTEXT.md"
          - "docs/PROJECT_STATUS.md"
          - "docs/architecture/README.md"
          - "docs/architecture/PRINCIPLES.md"
          - "docs/architecture/UI_ARCHITECTURE.md"
          - "docs/decisions/README.md"
          - "docs/decisions/ADR-001-model-abstraction.md"
          - "docs/decisions/ADR-002-obsidian-second-brain.md"
          - "docs/decisions/ADR-003-rag-pipeline-reranking.md"
          - "docs/decisions/ADR-004-explicit-context-budgeting.md"
          - "docs/decisions/ADR-005-layered-prompt-architecture.md"
          - "docs/decisions/ADR-006-security-below-model-layer.md"
          - "docs/decisions/ADR-007-documentation-language-convention.md"
          - "docs/decisions/ADR-008-modular-tool-contracts.md"
          - "docs/decisions/ADR-009-documentation-as-long-term-memory.md"
          - "docs/decisions/ADR-010-multi-root-workspace-and-path-aliasing.md"
          - "docs/decisions/ADR-011-project-memory-vs-global-knowledge-separation.md"
          - "docs/decisions/ADR-012-agent-memory-vs-current-state-separation.md"
          - "docs/decisions/ADR-013-sequential-deployment-stages.md"
          - "docs/decisions/ADR-014-infrastructure-stability-over-feature-breadth.md"
          - "docs/decisions/ADR-015-automation-with-manual-disabled-modes.md"
          - "docs/decisions/ADR-016-structured-tool-invocation-logging.md"
          - "docs/decisions/ADR-017-single-agent-stability-before-multi-agent.md"
          - "docs/decisions/ADR-018-multi-agent-communication-protocol.md"
          - "docs/decisions/ADR-019-provider-registry-and-factory.md"
          - "docs/decisions/ADR-020-local-web-application.md"
          - "docs/decisions/ADR-021-project-centric-engineering-workbench.md"
          - "docs/roadmap/README.md"
          - "docs/roadmap/M04-Knowledge_System_&_RAG_Pipeline.md"
          - "docs/roadmap/M14-Performance_&_Context-Efficiency_Audit.md"
          - "docs/roadmap/M17-Second_Brain_&_Global_Knowledge_Integration.md"
          - "docs/roadmap/M20-Multi-Project_Workspace.md"
          - "knowledge/**/*.md"
      vector_store:
        enabled: true
        host: "localhost"
        port: 8000
        timeout: 30
        project_collection: "laew_project"
        global_collection: "laew_global"

    # ------------------------------------------------------------------------------
    # 6. Agent Robustness (LLM Providers & Retry)
    # ------------------------------------------------------------------------------
    agent:
      llm:
        providers:
          - name: "llamacpp_primary"
            type: "llama.cpp"
            # Discover the loaded chat model from llama.cpp /v1/models.
            host: "127.0.0.1"
            port: 8080
        roles:
          primary: ["llamacpp_primary"]
          reviewer: ["llamacpp_primary"]
        retry:
          max_attempts: 3
          backoff_base_ms: 1000
          max_backoff_ms: 5000
